<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemesanan - Kebun Refugia Magetan</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Nunito:wght@300;400;500;600;700;800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="pemesanan.css">
</head>
<body>
  <section class="section">
    <div class="inner pemes-grid">
      <div class="qr-box">
        <img src="qr-code.png" alt="QR Code Pemesanan">
        <h3>Scan untuk Memesan</h3>
        <p>Gunakan E-Wallet atau M-Banking Anda untuk melakukan pembayaran digital di lokasi.</p>
      </div>
      <div class="tiket-stack">
        <h2 class="sec-title">Informasi Tiket</h2>
        <div class="tcard">
          <div class="tcard-left" style="background:var(--g2);">
            <div class="tlabel">Dewasa</div>
          </div>
          <div class="tcard-right">
            <strong>Rp 10.000</strong>
            <span class="tsub">Per Orang</span>
          </div>
        </div>
        <div class="tcard">
          <div class="tcard-left" style="background:var(--y1);">
            <div class="tlabel">Anak-anak</div>
          </div>
          <div class="tcard-right">
            <strong>Rp 5.000</strong>
            <span class="tsub">Per Orang</span>
          </div>
        </div>
        <div class="jam-info">
          <div class="jam-ico">⏱️</div>
          <div>
            <strong>Jam Operasional</strong>
            <span>Buka Setiap Hari: 08:30 - 16:30 WIB</span>
          </div>
        </div>
        <button class="btn-wa-order">Pesan via WhatsApp</button>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
