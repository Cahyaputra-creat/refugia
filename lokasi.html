<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lokasi - Kebun Refugia Magetan</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Nunito:wght@300;400;500;600;700;800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="lokasi.css">
</head>
<body>
  <section class="section alt">
    <div class="inner lokasi-grid">
      <div class="map-vis">
        <div class="map-pin">📍</div>
        <div class="map-label">Kebun Refugia Magetan</div>
      </div>
      <div class="lok-cards">
        <h2 class="sec-title">Lokasi Kami</h2>
        <div class="lok-card">
          <div class="lok-ico" style="background:var(--y3); color:var(--y1);">🗺️</div>
          <div>
            <h4>Alamat</h4>
            <p>Jl. Raya Sarangan, Plaosan II, Kecamatan Plaosan, Kabupaten Magetan, Jawa Timur 63361.</p>
          </div>
        </div>
        <div class="lok-card">
          <div class="lok-ico" style="background:var(--g5); color:var(--g2);">🚗</div>
          <div>
            <h4>Area Parkir</h4>
            <p>Tersedia area parkir luas yang dapat menampung kendaraan pribadi hingga bus rombongan wisata.</p>
            <div class="parkir-tags">
              <span class="parkir-tag">Mobil</span>
              <span class="parkir-tag">Motor</span>
              <span class="parkir-tag">Bus</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
